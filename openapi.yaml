    "title": "Планировщик городского досуга в MAX",
    "version": "2026-09-27",
    "description": "Actual HTTP contract of the working tree. Not a release-readiness or live-quality claim. Generated from shared Zod schemas where available; timestamps/prices/travel times are explicit fields. Dates and time windows are also semantically checked in runtime. No credentials are embedded. JSON notation is used as the YAML 1.2 subset to avoid an extra runtime dependency."
  },
  "servers": [
    {
      "url": "https://bbapc7qgk242slpm2df5.containers.yandexcloud.net",
      "description": "Existing configured HTTPS deployment; availability and parity with this working tree require a separate release check."
    },
    {
      "url": "http://127.0.0.1:3000",
      "description": "Local Docker Compose; this URL alone does not provide MAX authorization."
    }
  ],
  "tags": [
    {
      "name": "contract",
      "description": "Freeze the code and these documents together after local and MAX checks."
    }
  ],
