    "/api/planning/saved/{id}": {
      "get": {
        "operationId": "getSavedConditions",
        "summary": "Read durable user conditions without restoring provider facts",
        "security": [
          {
            "MaxInitData": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Opaque saved-conditions identifier; unknown, foreign or expired records return 404."
          }
        ],
        "description": "Reads only the authenticated owner's durable conditions. Does not call the LLM or calculate a route. Coordinates can exist only for an explicitly selected user map/geolocation point; they are not the current location. Provider place/rubric IDs, address labels, catalogs, schedules, prices and itineraries are not part of this payload. Check reconfirmation_required before restoring.",
        "responses": {
          "200": {
            "description": "Saved own conditions and their revision/expiry; not a provider itinerary.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SavedConditionsView"
                }
              }
            }
          },
