[project]
name = "vmax-place-selector"
version = "0.1.0"
description = "Deterministic place selection from confirmed daily intent"
requires-python = ">=3.12,<3.13"
dependencies = ["ortools==9.15.6755"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
