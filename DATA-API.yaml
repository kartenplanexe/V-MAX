      "source": "Fresh MAX launch header; see docs/testing.md.",
      "secret": true
    },
    "LOCALITY_TOKEN": {
      "source_check": "localities",
      "json_pointer": "/choices/0/token",
      "secret": true,
      "precondition": "Verify that the selected result is Москва."
    },
    "DRAFT_ID": {
      "source_check": "create-draft",
      "json_pointer": "/view/id"
    },
    "DRAFT_VERSION": {
      "source": "Latest PlanningView.version from each successful edit/confirm."
    },
    "SAVED_REVISION": {
      "source_check": "read-saved",
      "json_pointer": "/revision",
      "precondition": "Use DRAFT_ID; re-read the saved revision after any edit."
    },
    "RESTORE_LOCALITY_TOKEN": {
      "source_check": "refresh-saved-locality",
      "json_pointer": "/choices/0/token",
      "secret": true,
      "precondition": "Select Москва again using a fresh locality token."
    },
    "DAY_ID": {
      "source_check": "create-draft",
      "json_pointer": "/view/draft/days/0/day_id"
    },
    "EVENT_SEARCH_ID": {
      "source_check": "events-search",
      "json_pointer": "/search_id"
    },
    "EVENT_CHOICE_ID": {
      "source_check": "events-search",
      "json_pointer": "/cards/0/choice_id",
      "precondition": "Choose a card for the selected day. If cards is empty, record the event scenario as blocked, not passed."
    },
    "OCCURRENCE_CHOICE_ID": {
      "source_check": "events-availability",
      "json_pointer": "/choices/0/occurrence_choice_id",
      "precondition": "Choose an occurrence within the day window. Empty choices block selection; inspect unresolved."
    },
    "EVENT_VISIT_MINUTES": {
      "source": "For duration_required=true choose 5..720 minutes fitting the visit window. Otherwise omit visit_duration_minutes from the request body."
    },
    "SELECTED_ACTIVITY_ID": {
      "source": "events-select response: ID of the newly appended event activity in draft.days for DAY_ID."
    },
    "ADDRESS_LAT": {
      "source_check": "addresses",
      "json_pointer": "/choices/0/point/lat"
    },
    "ADDRESS_LON": {
      "source_check": "addresses",
      "json_pointer": "/choices/0/point/lon"
    },
    "ADDRESS_LABEL": {
      "source_check": "addresses",
      "json_pointer": "/choices/0/label"
    },
    "EVENT_ID": {
      "source": "New UUID for each explicit action; reuse only when deliberately testing deduplication."
    },
    "MANUAL_CATALOG": {
      "source_check": "manual-options",
      "json_pointer": "/catalog_version"
    },
    "MANUAL_CATEGORY": {
      "source_check": "manual-options",
      "json_pointer": "/categories/0/id",
