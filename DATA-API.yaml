      "source": "A future YYYY-MM-DD date explicitly chosen by the tester in the locality timezone."
    },
    "MANUAL_ID": {
      "source_check": "manual-create",
      "json_pointer": "/id"
    },
    "MANUAL_REVISION": {
      "source_check": "manual-read-saved",
      "json_pointer": "/revision"
    },
    "SHARE_TOKEN": {
      "source_check": "share-create",
      "json_pointer": "/token",
      "secret": true
    },
    "SHARE_ID": {
      "source_check": "share-create",
      "json_pointer": "/share_id",
      "secret": true
    }
