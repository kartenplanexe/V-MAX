  "test_data_file": "test-data/api-scenarios.json",
  "schema_reference_document": "openapi.yaml",
  "revision": {
    "status": "source_archive",
    "commit": null,
    "note": "The submitted source is the accompanying Git archive. Its SHA-256 checksum and local commit are printed on the first slide of the presentation."
  },
  "execution": {
    "automatic_runner": false,
    "instructions": "Execute checks in order with the test MAX user, or import OpenAPI into a compatible HTTP client. Placeholder substitution and JSON Pointer extraction below describe the procedure; this file does not pretend to be an organizer-provided runner.",
    "substitution": "A placeholder occupying an entire JSON value preserves the source type: versions, latitude and longitude must be numbers, not strings. Schema references resolve against openapi.yaml components.",
    "offline_contract_command": "node --import tsx scripts/api-contract.mts",
    "offline_http_test_command": "npm exec -- vitest run src/server/submission-api-contract.test.ts",
    "live_policy": "Use a dedicated authorized MAX test account. Explicitly initiated requests/plan may spend provider quota. Never log or publish initData, tokens or raw provider data; do not send valid synthetic webhook events to production."
  },
  "roles": {
    "anonymous": "No credentials.",
    "max_user": "Ordinary user of the supplied MAX bot. Team supplies a usable test account/access procedure privately; no admin access is needed."
  },
  "variables": {
    "MAX_TEST_INIT_DATA": {
      "source": "Fresh signed launch data from a mini-app opened by the test MAX user; transmitted privately/in memory, not stored in this repository.",
      "secret": true
    },
    "LOCALITY_TOKEN": {
      "source_check": "localities",
      "json_pointer": "/choices/0/token",
      "secret": true,
      "precondition": "Tester verifies that the chosen locality is Москва; do not blindly accept a different first result."
    },
    "DRAFT_ID": {
      "source_check": "create-draft",
      "json_pointer": "/view/id"
    },
    "DRAFT_VERSION": {
      "source": "Latest PlanningView.version from each successful edit/confirm."
    },
    "SAVED_REVISION": {
      "source_check": "read-saved",
      "json_pointer": "/revision",
      "precondition": "Saved IDs are stable: use DRAFT_ID for read/restore. Re-read the revision after any later edit; do not substitute PlanningView.version without checking the saved response."
    },
    "RESTORE_LOCALITY_TOKEN": {
      "source_check": "refresh-saved-locality",
      "json_pointer": "/choices/0/token",
      "secret": true,
      "precondition": "Explicitly verify/select Москва again. Do not reuse an expired provider token or infer a locality from stored provider IDs."
    },
    "DAY_ID": {
      "source_check": "create-draft",
      "json_pointer": "/view/draft/days/0/day_id"
    },
    "ADDRESS_LAT": {
      "source_check": "addresses",
      "json_pointer": "/choices/0/point/lat"
    },
    "ADDRESS_LON": {
      "source_check": "addresses",
      "json_pointer": "/choices/0/point/lon"
    },
    "ADDRESS_LABEL": {
      "source_check": "addresses",
      "json_pointer": "/choices/0/label"
    },
    "EVENT_ID": {
      "source": "New UUID for each explicit action; reuse only when deliberately testing deduplication."
    },
    "MANUAL_CATALOG": {
      "source_check": "manual-options",
      "json_pointer": "/catalog_version"
    },
    "MANUAL_CATEGORY": {
      "source_check": "manual-options",
      "json_pointer": "/categories/0/id",
      "precondition": "Choose an actual desired category from the returned list; do not invent a 2GIS ID."
    },
    "MANUAL_DATE": {
      "source": "A future YYYY-MM-DD date explicitly chosen by the tester in the locality timezone."
    },
    "MANUAL_ID": {
      "source_check": "manual-create",
      "json_pointer": "/id"
    },
    "MANUAL_REVISION": {
      "source_check": "manual-read-saved",
      "json_pointer": "/revision"
    },
    "SHARE_TOKEN": {
      "source_check": "share-create",
      "json_pointer": "/token",
      "secret": true
    },
    "SHARE_ID": {
      "source_check": "share-create",
      "json_pointer": "/share_id",
      "secret": true
    }
  },
